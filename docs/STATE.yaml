future_work:
  numbering_starts_at: WU-101
  default_state: BACKLOG
  rule: New changes after the frozen WU-100 candidate must be created as new Working Units or Change Requests; do not patch locked predecessors in place.

state_machine:
  normal:
    - BACKLOG
    - READY
    - IN_PROGRESS
    - READY_FOR_REVIEW
    - REVIEW
    - READY_FOR_TEST
    - TESTING
    - APPROVAL
    - LOCKED
  side_states:
    - BLOCKED
    - CHANGE_REQUEST

orchestration:
  parallelize_only_when:
    - dependencies are LOCKED or BASELINED
    - affected workflow/node ownership does not overlap
    - shared contracts are frozen before worker execution
  next_action:
    - inventory current n8n workflows and workflow IDs
    - import/version the current frozen candidate in GitHub
    - define staging deployment path
    - create WU-101+ only from explicit new requirements or unresolved runtime/canary work
