name: WU105 CR-105-04 policy source contract

on:
  push:
    branches:
      - wu105-planning
    paths:
      - '.github/workflows/wu105-cr10504-contract.yml'
      - 'scripts/wu105/apply_cr10504.py'
      - 'scripts/wu105/test_cr10504.py'

permissions:
  contents: read
  actions: read

env:
  WU104_LOCK_RUN_ID: '33663124381'
  WU104_ARTIFACT_NAME: wu104-cr10405-evidence
  WU104_UPSTREAM: locked-wu104/n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  WU104_EXPECTED_SHA256: 32721cae2b09531d8f4860373c37911ace9e95b6818babdca880fa08ef1b7bc9
  CR10501_BASE: /tmp/SPM_WU105_CR10501_BASE.json
  CR10501_SHA: e40610b13ec61a781acf44842b74955a88a11286e83baa7e121aee349cc9dcf0
  CR10502_BASE: /tmp/SPM_WU105_CR10502_BASE.json
  CR10502_SHA: 7fc201137671b1cd47f9fc6b4ec60a9b563b2bae7c0776952ec68e0988bfed1e
  CR10503_BASE: /tmp/SPM_WU105_CR10503_BASE.json
  CR10503_SHA: aaaa139faa67815f4196fb9779232471c4c8b051a26f0ba0a3be4c56231d4653
  CR10504_FINAL: n8n/generated/SPM_WU105_STAGING_GOLDEN_INTENTS_CANDIDATE.json

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact locked WU-104 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}
      - name: Rebuild exact CR-105-03 input candidate
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:work-units/WU-104.lock.md > /tmp/WU-104.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-104.lock.md
          test "$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')" = "$WU104_EXPECTED_SHA256"
          python scripts/wu105/build_candidate.py --baseline "$WU104_UPSTREAM" --manifest contracts/WU105_GOLDEN_INTENTS_V1.json --output "$CR10501_BASE"
          test "$(sha256sum "$CR10501_BASE" | awk '{print $1}')" = "$CR10501_SHA"
          python scripts/wu105/test_cr10502.py --input "$CR10501_BASE"
          python scripts/wu105/apply_cr10502.py --input "$CR10501_BASE" --output "$CR10502_BASE"
          test "$(sha256sum "$CR10502_BASE" | awk '{print $1}')" = "$CR10502_SHA"
          python scripts/wu105/test_cr10503.py --input "$CR10502_BASE"
          python scripts/wu105/apply_cr10503.py --input "$CR10502_BASE" --output "$CR10503_BASE"
          test "$(sha256sum "$CR10503_BASE" | awk '{print $1}')" = "$CR10503_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CR10503_BASE"]))["nodes"]))')" = "130"
      - name: Test CR-105-04 source wiring
        run: python scripts/wu105/test_cr10504.py --input "$CR10503_BASE"
      - name: Build CR-105-04 final candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n8n/generated
          python scripts/wu105/apply_cr10504.py --input "$CR10503_BASE" --output "$CR10504_FINAL"
          echo "WU105_CR10504_FINAL_SHA256=$(sha256sum "$CR10504_FINAL" | awk '{print $1}')"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CR10504_FINAL"]))["nodes"]))')" = "131"
      - name: Upload CR-105-04 deterministic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu105-cr10504-candidate
          path: |
            n8n/generated/SPM_WU105_STAGING_GOLDEN_INTENTS_CANDIDATE.json
            contracts/WU105_RUNTIME_MATRIX_V1.json
          if-no-files-found: ignore
          retention-days: 30
