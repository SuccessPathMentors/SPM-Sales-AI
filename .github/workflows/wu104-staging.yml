name: WU-104 short query staging

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/wu104/**"
      - "contracts/WU104_*.schema.json"
      - "work-units/WU-104.md"
      - ".github/workflows/wu104-staging.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run performs zero n8n writes; apply may create/update only inactive WU-104 STAGING"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      target_workflow_id:
        description: "Existing WU-104 STAGING workflow ID. Leave blank only for first deliberate create."
        required: false
        type: string
        default: ""
      allow_create:
        description: "Explicitly permit one-time WU-104 STAGING creation when target_workflow_id is blank"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wu104-staging-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr-validation' }}
  cancel-in-progress: false

env:
  BASELINE: n8n/workflows/production/SPM_RC4_3_3_PRODUCTION_FINAL_2026-08-28.json
  CANDIDATE: n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  EXPECTED_SHA256: CR10401_TO_LOCK_AFTER_CI
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn
  LOCKED_WU101_STAGING_ID: mMZVFxJIxE7a9SSW
  LOCKED_WU102_STAGING_ID: 1kaRBBFVJYbPxvQG
  LOCKED_WU103_STAGING_ID: 5COEoxXjk8AvuGBa

jobs:
  validate:
    name: WU104 contract candidate parity
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build deterministic WU-104 candidate
        run: |
          set -euo pipefail
          mkdir -p n8n/generated
          python scripts/wu104/build_context_await_candidate.py --baseline "$BASELINE" --output "$CANDIDATE"
      - name: Run WU-104 contracts core candidate parity
        run: |
          set -euo pipefail
          python scripts/wu104/test_contracts.py
          python scripts/wu104/test_core.py
          python scripts/wu104/test_candidate.py
          python scripts/wu104/test_context_await_candidate.py
      - name: Verify locked candidate SHA-256
        run: |
          set -euo pipefail
          actual="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          echo "WU104_CANDIDATE_SHA256=$actual"
          test "$actual" = "$EXPECTED_SHA256"
      - name: Existing non-production deployer dry-run
        run: |
          set -euo pipefail
          python scripts/n8n/deploy_nonprod.py \
            --artifact "$CANDIDATE" \
            --environment staging \
            --expected-sha256 "$EXPECTED_SHA256" \
            --mode dry-run \
            --result-file wu104-dry-run-result.json
      - name: Upload candidate and dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu104-candidate-and-dry-run
          path: |
            n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
            wu104-dry-run-result.json
          if-no-files-found: ignore
          retention-days: 30

  deploy-staging:
    name: WU104 ${{ inputs.mode }} to staging
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_TARGET_WORKFLOW_ID: ${{ inputs.target_workflow_id }}
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rebuild and verify exact WU-104 candidate
        run: |
          set -euo pipefail
          mkdir -p n8n/generated
          python scripts/wu104/build_context_await_candidate.py --baseline "$BASELINE" --output "$CANDIDATE"
          python scripts/wu104/test_contracts.py
          python scripts/wu104/test_core.py
          python scripts/wu104/test_candidate.py
          python scripts/wu104/test_context_await_candidate.py
          actual="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
      - name: Hard-stop manual target checks
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.target_workflow_id }}"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$LOCKED_WU101_STAGING_ID" "$LOCKED_WU102_STAGING_ID" "$LOCKED_WU103_STAGING_ID"; do
            if [[ "$target" == "$denied" ]]; then
              echo "Denied locked/Production workflow ID: $target" >&2
              exit 1
            fi
          done
          if [[ "${{ inputs.mode }}" == "apply" && -z "$target" && "${{ inputs.allow_create }}" != "true" ]]; then
            echo "First WU-104 apply with no target requires allow_create=true" >&2
            exit 1
          fi
          if [[ "${{ inputs.allow_create }}" == "true" && -n "$target" ]]; then
            echo "allow_create=true is permitted only when target_workflow_id is blank" >&2
            exit 1
          fi
      - name: Run safe non-production deployer
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --artifact "$CANDIDATE"
            --environment staging
            --expected-sha256 "$EXPECTED_SHA256"
            --mode "${{ inputs.mode }}"
            --result-file wu104-deployment-result.json
          )
          if [[ -n "${{ inputs.target_workflow_id }}" ]]; then
            args+=(--target-workflow-id "${{ inputs.target_workflow_id }}")
          fi
          if [[ "${{ inputs.allow_create }}" == "true" ]]; then
            args+=(--allow-create)
          fi
          python scripts/n8n/deploy_nonprod.py "${args[@]}"
      - name: Verify remote WU-104 STAGING content after apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          target="$(python - <<'PY'
          import json
          print(json.load(open('wu104-deployment-result.json'))['target_workflow_id'])
          PY
          )"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$LOCKED_WU101_STAGING_ID" "$LOCKED_WU102_STAGING_ID" "$LOCKED_WU103_STAGING_ID"; do
            test "$target" != "$denied"
          done
          N8N_TARGET_WORKFLOW_ID="$target" python scripts/wu104/verify_remote_staging.py
      - name: Upload WU-104 deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu104-staging-${{ inputs.mode }}-evidence
          path: |
            n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
            wu104-deployment-result.json
          if-no-files-found: ignore
          retention-days: 30
