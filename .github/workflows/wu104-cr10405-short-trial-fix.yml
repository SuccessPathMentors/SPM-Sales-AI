name: WU104 CR-104-05 short trial inquiry fix

on:
  push:
    branches:
      - 'wu104-context-binding-live-fix'
    paths:
      - '.github/workflows/wu104-cr10405-short-trial-fix.yml'
      - 'scripts/wu104/**'
      - 'scripts/n8n/deploy_nonprod.py'

permissions:
  contents: read

env:
  BASELINE: n8n/workflows/production/SPM_RC4_3_3_PRODUCTION_FINAL_2026-08-28.json
  CANDIDATE: n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  N8N_TARGET_WORKFLOW_ID: Bt3PvOIbFzU0O9gk
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn

jobs:
  deploy-cr10405:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and validate WU-104 CR-104-05 candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p n8n/generated
          python scripts/wu104/build_short_trial_query_candidate.py --baseline "$BASELINE" --output "$CANDIDATE"
          python scripts/wu104/test_contracts.py
          python scripts/wu104/test_core.py
          python scripts/wu104/test_candidate.py
          python scripts/wu104/test_context_await_candidate.py
          python scripts/wu104/test_context_await_signals.py
          python scripts/wu104/test_known_slot_signals.py
          python scripts/wu104/test_short_trial_query_signals.py
          actual="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          echo "WU104_CR10405_SHA256=$actual"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          test "$(python -c 'import json; print(len(json.load(open("n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json"))["nodes"]))')" = "126"
      - name: Hard-stop protected targets
        shell: bash
        run: |
          set -euo pipefail
          test "$N8N_TARGET_WORKFLOW_ID" != "$PRODUCTION_WORKFLOW_ID"
          test "$N8N_TARGET_WORKFLOW_ID" != "mMZVFxJIxE7a9SSW"
          test "$N8N_TARGET_WORKFLOW_ID" != "1kaRBBFVJYbPxvQG"
          test "$N8N_TARGET_WORKFLOW_ID" != "5COEoxXjk8AvuGBa"
      - name: Apply CR-104-05 to inactive WU-104 STAGING only
        shell: bash
        run: |
          set -euo pipefail
          python scripts/n8n/deploy_nonprod.py \
            --artifact "$CANDIDATE" \
            --environment staging \
            --expected-sha256 "${{ steps.build.outputs.sha }}" \
            --target-workflow-id "$N8N_TARGET_WORKFLOW_ID" \
            --mode apply \
            --result-file wu104-cr10405-deployment-result.json
      - name: Verify remote WU-104 STAGING CR-104-05
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu104/verify_remote_staging_cr10405.py
      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu104-cr10405-evidence
          path: |
            n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
            wu104-cr10405-deployment-result.json
          if-no-files-found: ignore
          retention-days: 30
