name: WU105 one-time inactive staging deploy

on:
  push:
    branches:
      - wu105-planning
    paths:
      - '.github/workflows/wu105-one-time-staging-deploy.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: wu105-one-time-staging-deploy
  cancel-in-progress: false

env:
  WU104_LOCK_RUN_ID: '33663124381'
  WU104_ARTIFACT_NAME: wu104-cr10405-evidence
  WU104_UPSTREAM: locked-wu104/n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  WU104_EXPECTED_SHA256: 32721cae2b09531d8f4860373c37911ace9e95b6818babdca880fa08ef1b7bc9
  WU105_CANDIDATE: n8n/generated/SPM_WU105_STAGING_GOLDEN_INTENTS_CANDIDATE.json
  WU105_EXPECTED_SHA256: f02ab822c37e8cad6b45f83934361bc2388e540070b2c38b15ce631f93f6171c
  WU105_EXPECTED_NAME: '[STAGING] SPM_WU105_GOLDEN_INTENTS_V1'
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn
  WU101_STAGING_ID: mMZVFxJIxE7a9SSW
  WU102_STAGING_ID: 1kaRBBFVJYbPxvQG
  WU103_STAGING_ID: 5COEoxXjk8AvuGBa
  WU104_STAGING_ID: Bt3PvOIbFzU0O9gk

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact locked WU-104 CR-104-05 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}
      - name: Verify formal WU-104 lock and exact artifact
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:work-units/WU-104.lock.md > /tmp/WU-104.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-104.lock.md
          grep -q "$WU104_EXPECTED_SHA256" /tmp/WU-104.lock.md
          test "$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')" = "$WU104_EXPECTED_SHA256"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["WU104_UPSTREAM"]))["nodes"]))')" = "126"
      - name: Build and validate reconciled WU-105 candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu105/test_manifest.py
          python scripts/wu105/test_runtime_matrix.py
          python scripts/wu105/test_candidate.py
          mkdir -p n8n/generated
          python scripts/wu105/build_candidate.py \
            --baseline "$WU104_UPSTREAM" \
            --manifest contracts/WU105_GOLDEN_INTENTS_V1.json \
            --output "$WU105_CANDIDATE"
          actual="$(sha256sum "$WU105_CANDIDATE" | awk '{print $1}')"
          echo "WU105_CANDIDATE_SHA256=$actual"
          test "$actual" = "$WU105_EXPECTED_SHA256"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["WU105_CANDIDATE"]))["nodes"]))')" = "127"
      - name: Resolve exact WU-105 STAGING target fail-closed
        id: target
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, sys, urllib.parse, urllib.request
          base=os.environ['N8N_API_BASE_URL'].rstrip('/')
          key=os.environ['N8N_API_KEY']
          expected=os.environ['WU105_EXPECTED_NAME']
          protected={
            os.environ['PRODUCTION_WORKFLOW_ID'], os.environ['WU101_STAGING_ID'],
            os.environ['WU102_STAGING_ID'], os.environ['WU103_STAGING_ID'],
            os.environ['WU104_STAGING_ID'],
          }
          matches=[]
          cursor=None
          seen=set()
          for _ in range(50):
              params={'limit':'100'}
              if cursor: params['cursor']=cursor
              url=base+'/workflows?'+urllib.parse.urlencode(params)
              req=urllib.request.Request(url,headers={'accept':'application/json','X-N8N-API-KEY':key})
              with urllib.request.urlopen(req,timeout=45) as resp:
                  data=json.loads(resp.read().decode('utf-8'))
              rows=data.get('data',[])
              if not isinstance(rows,list):
                  raise SystemExit('Unexpected n8n workflow list response')
              for wf in rows:
                  wid=str(wf.get('id') or '')
                  if wid and wid not in seen:
                      seen.add(wid)
                      if wf.get('name')==expected:
                          matches.append(wf)
              cursor=data.get('nextCursor')
              if not cursor: break
          else:
              raise SystemExit('n8n workflow pagination exceeded safety limit')
          if len(matches)>1:
              raise SystemExit(f'Duplicate exact WU-105 STAGING workflows found: {[m.get("id") for m in matches]}')
          if matches:
              wf=matches[0]
              wid=str(wf.get('id') or '')
              if wid in protected:
                  raise SystemExit(f'Protected workflow ID collision: {wid}')
              if wf.get('active') is True:
                  raise SystemExit(f'Existing exact WU-105 workflow is active; refusing update: {wid}')
              mode='UPDATE_EXISTING_INACTIVE'
          else:
              wid=''
              mode='CREATE_NEW_INACTIVE'
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a',encoding='utf-8') as f:
              f.write(f'target_id={wid}\n')
              f.write(f'resolve_mode={mode}\n')
          print(json.dumps({'exact_name':expected,'match_count':len(matches),'target_id':wid or None,'resolve_mode':mode},indent=2))
          PY
      - name: Apply only to resolved inactive WU-105 STAGING
        shell: bash
        run: |
          set -euo pipefail
          target='${{ steps.target.outputs.target_id }}'
          args=(
            --artifact "$WU105_CANDIDATE"
            --environment staging
            --expected-sha256 "$WU105_EXPECTED_SHA256"
            --mode apply
            --result-file wu105-one-time-deployment-result.json
          )
          if [[ -n "$target" ]]; then
            args+=(--target-workflow-id "$target")
          else
            args+=(--allow-create)
          fi
          python scripts/n8n/deploy_nonprod.py "${args[@]}"
      - name: Verify remote WU-105 STAGING readback
        shell: bash
        run: |
          set -euo pipefail
          target="$(python - <<'PY'
          import json
          print(json.load(open('wu105-one-time-deployment-result.json'))['target_workflow_id'])
          PY
          )"
          test -n "$target"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$WU101_STAGING_ID" "$WU102_STAGING_ID" "$WU103_STAGING_ID" "$WU104_STAGING_ID"; do
            test "$target" != "$denied"
          done
          N8N_TARGET_WORKFLOW_ID="$target" python scripts/wu105/verify_remote_staging.py
      - name: Upload WU-105 one-time deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu105-one-time-staging-deployment-evidence
          path: |
            n8n/generated/SPM_WU105_STAGING_GOLDEN_INTENTS_CANDIDATE.json
            contracts/WU105_RUNTIME_MATRIX_V1.json
            wu105-one-time-deployment-result.json
          if-no-files-found: ignore
          retention-days: 30
