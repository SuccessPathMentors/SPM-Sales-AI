name: WU-103 knowledge maintenance contract

on:
  pull_request:
    paths:
      - 'contracts/WU103_*'
      - 'scripts/wu103/**'
      - 'work-units/WU-103.md'
      - '.github/workflows/wu103-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wu103-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Contract and adapter tests
        run: python scripts/wu103/test_contracts.py
      - name: Deterministic core tests
        run: python scripts/wu103/test_core.py
