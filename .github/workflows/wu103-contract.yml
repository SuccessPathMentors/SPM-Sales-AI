name: WU-103 knowledge maintenance contract

on:
  pull_request:
    paths:
      - 'contracts/WU103_*'
      - 'scripts/wu103/**'
      - 'evidence/wu103/**'
      - 'work-units/WU-103.md'
      - 'work-units/CR-103-*'
      - '.github/workflows/wu103-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wu103-contract:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Contract and adapter tests
        run: python scripts/wu103/test_contracts.py
      - name: Deterministic core tests
        run: python scripts/wu103/test_core.py
      - name: Regression evidence verification
        run: python scripts/wu103/verify_regression_evidence.py
      - name: Legacy FB-003 regression verification
        run: python scripts/wu103/verify_legacy_fb003_regression.py
      - name: STAGING maintenance workflow static safety tests
        run: python scripts/wu103/test_staging_workflow.py
      - name: Build hardened candidate and print deterministic SHA
        run: |
          mkdir -p n8n/generated
          python scripts/wu103/build_staging_workflow_hardened.py --output n8n/generated/SPM_WU103_KNOWLEDGE_MAINTENANCE_STAGING_CANDIDATE.json
          sha256sum n8n/generated/SPM_WU103_KNOWLEDGE_MAINTENANCE_STAGING_CANDIDATE.json
      - name: Upload WU-103 candidate
        uses: actions/upload-artifact@v4
        with:
          name: wu103-maintenance-candidate
          path: n8n/generated/SPM_WU103_KNOWLEDGE_MAINTENANCE_STAGING_CANDIDATE.json
          retention-days: 30
