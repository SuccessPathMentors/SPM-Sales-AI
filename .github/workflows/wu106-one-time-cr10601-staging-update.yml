name: WU-106 one-time CR-106-01 STAGING update

on:
  push:
    branches:
      - wu106-planning
    paths:
      - '.github/workflows/wu106-one-time-cr10601-staging-update.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: wu106-one-time-cr10601-staging-update
  cancel-in-progress: false

env:
  WU104_LOCK_RUN_ID: '33663124381'
  WU104_ARTIFACT_NAME: wu104-cr10405-evidence
  WU104_UPSTREAM: locked-wu104/n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  WU104_EXPECTED_SHA256: 32721cae2b09531d8f4860373c37911ace9e95b6818babdca880fa08ef1b7bc9
  CR10501: /tmp/SPM_WU105_CR10501.json
  CR10501_SHA: e40610b13ec61a781acf44842b74955a88a11286e83baa7e121aee349cc9dcf0
  CR10502: /tmp/SPM_WU105_CR10502.json
  CR10502_SHA: 7fc201137671b1cd47f9fc6b4ec60a9b563b2bae7c0776952ec68e0988bfed1e
  CR10503: /tmp/SPM_WU105_CR10503.json
  CR10503_SHA: aaaa139faa67815f4196fb9779232471c4c8b051a26f0ba0a3be4c56231d4653
  WU105_FINAL: /tmp/SPM_WU105_FINAL_CR10504.json
  WU105_FINAL_SHA: 42ba2b9de1f52c0db1fc32e59974dc40ebce80b787677ac6b0d4418a6315bca1
  WU106_BASELINE: /tmp/SPM_WU106_OBSERVE_ONLY_BASELINE.json
  WU106_BASELINE_SHA: 134b2d861d6c5060ca52d8fd838b2cdd7d5d88ffa74855e3de1665e302afda67
  CANDIDATE: n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
  FINAL_SHA: 5db680c1e2b51d35408f78077ef4bb098da542bdf5e071125532948ad6783e2e
  TARGET_ID: vvHvidUHVxM5wTVT
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn
  WU101_STAGING_ID: mMZVFxJIxE7a9SSW
  WU102_STAGING_ID: 1kaRBBFVJYbPxvQG
  WU103_STAGING_ID: 5COEoxXjk8AvuGBa
  WU104_STAGING_ID: Bt3PvOIbFzU0O9gk
  WU105_STAGING_ID: KXfalaYSCLdgmf4X

jobs:
  update:
    if: "${{ github.event.head_commit.message == 'WU-106: one-time CR-106-01 STAGING update' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_TARGET_WORKFLOW_ID: vvHvidUHVxM5wTVT
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download exact locked WU-104 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}
      - name: Rebuild and certify exact CR-106-01 candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$N8N_TARGET_WORKFLOW_ID" = "$TARGET_ID"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$WU101_STAGING_ID" "$WU102_STAGING_ID" "$WU103_STAGING_ID" "$WU104_STAGING_ID" "$WU105_STAGING_ID"; do test "$TARGET_ID" != "$denied"; done
          git show origin/main:work-units/WU-105.lock.md > /tmp/WU-105.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-105.lock.md
          grep -q "$WU105_FINAL_SHA" /tmp/WU-105.lock.md
          test "$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')" = "$WU104_EXPECTED_SHA256"
          python scripts/wu105/build_candidate.py --baseline "$WU104_UPSTREAM" --manifest contracts/WU105_GOLDEN_INTENTS_V1.json --output "$CR10501"
          test "$(sha256sum "$CR10501" | awk '{print $1}')" = "$CR10501_SHA"
          python scripts/wu105/apply_cr10502.py --input "$CR10501" --output "$CR10502"
          test "$(sha256sum "$CR10502" | awk '{print $1}')" = "$CR10502_SHA"
          python scripts/wu105/apply_cr10503.py --input "$CR10502" --output "$CR10503"
          test "$(sha256sum "$CR10503" | awk '{print $1}')" = "$CR10503_SHA"
          python scripts/wu105/apply_cr10504.py --input "$CR10503" --output "$WU105_FINAL"
          test "$(sha256sum "$WU105_FINAL" | awk '{print $1}')" = "$WU105_FINAL_SHA"
          mkdir -p n8n/generated
          python scripts/wu106/build_candidate.py --baseline "$WU105_FINAL" --output "$WU106_BASELINE"
          test "$(sha256sum "$WU106_BASELINE" | awk '{print $1}')" = "$WU106_BASELINE_SHA"
          python scripts/wu106/apply_cr10601.py --input "$WU106_BASELINE" --output "$CANDIDATE"
          python scripts/wu106/test_cr10601.py --candidate "$CANDIDATE"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "$FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CANDIDATE"]))["nodes"]))')" = "133"
      - name: Update only existing inactive WU-106 STAGING
        run: |
          python scripts/n8n/deploy_nonprod.py \
            --artifact "$CANDIDATE" \
            --environment staging \
            --expected-sha256 "$FINAL_SHA" \
            --target-workflow-id "$TARGET_ID" \
            --mode apply \
            --result-file wu106-cr10601-update-result.json
      - name: Verify exact remote CR-106-01 content
        run: |
          N8N_TARGET_WORKFLOW_ID="$TARGET_ID" python scripts/wu106/verify_remote_staging.py
      - name: Upload one-time update evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu106-cr10601-one-time-staging-update-evidence
          path: |
            n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
            contracts/WU106_CR10601_IDENTITY_V1.json
            wu106-cr10601-update-result.json
          if-no-files-found: ignore
          retention-days: 30
