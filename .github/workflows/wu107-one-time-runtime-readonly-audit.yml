name: WU-107 one-time read-only runtime evidence audit

on:
  push:
    branches: [wu107-human-handoff]
    paths:
      - '.github/workflows/wu107-one-time-runtime-readonly-audit.yml'

permissions:
  contents: read

concurrency:
  group: wu107-one-time-runtime-readonly-audit
  cancel-in-progress: false

jobs:
  audit:
    if: "${{ github.event.head_commit.message == 'WU-107: one-time read-only runtime evidence audit' && github.run_attempt == 1 }}"
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      WU107_STAGING_ID: RtI7hxjNb6Z0JL0D
    steps:
      - uses: actions/checkout@v4

      - name: Read recent WU-107 executions and emit sanitized evidence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request

          base=(os.environ['N8N_API_BASE_URL'] or '').rstrip('/')
          key=os.environ['N8N_API_KEY']
          wid=os.environ['WU107_STAGING_ID']
          assert base.endswith('/api/v1')
          assert wid=='RtI7hxjNb6Z0JL0D'

          def get(path):
              req=urllib.request.Request(base+'/'+path.lstrip('/'),headers={'accept':'application/json','X-N8N-API-KEY':key})
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode())

          q=urllib.parse.urlencode({'workflowId':wid,'limit':30,'includeData':'true'})
          listing=get('executions?'+q)
          rows=listing.get('data') if isinstance(listing,dict) else None
          if not isinstance(rows,list):
              rows=[]

          executions=[]
          for row in rows:
              if not isinstance(row,dict):
                  continue
              ex=row
              data=ex.get('data')
              if not isinstance(data,dict) or 'resultData' not in data:
                  eid=ex.get('id')
                  if eid:
                      try:
                          ex=get(f'executions/{eid}?includeData=true')
                      except Exception:
                          continue
              executions.append(ex)

          def node_jsons(ex,node):
              out=[]
              try:
                  entries=ex['data']['resultData']['runData'].get(node,[])
              except Exception:
                  return out
              for ent in entries:
                  try:
                      mains=ent.get('data',{}).get('main',[])
                      for branch in mains:
                          if not isinstance(branch,list): continue
                          for item in branch:
                              j=item.get('json') if isinstance(item,dict) else None
                              if isinstance(j,dict): out.append(j)
                  except Exception:
                      pass
              return out

          # Never print raw execution JSON. Only booleans/counts/PASS markers.
          queue_records=[]
          execution_results=[]
          existing_decisions=[]
          for ex in executions:
              for j in node_jsons(ex,'Build WU107 Queue Decision'):
                  d=j.get('wu107_queue_decision')
                  if isinstance(d,dict):
                      r=d.get('record_candidate')
                      if isinstance(r,dict): queue_records.append(r)
                      if d.get('decision') in ('EXISTING_QUEUED','EXISTING_ACCEPTED'):
                          existing_decisions.append(d)
              for node in ('Apply WU107 Verified Queue Result','Apply WU107 Existing Handoff Result'):
                  for j in node_jsons(ex,node):
                      r=j.get('wu107_handoff_execution')
                      if isinstance(r,dict): execution_results.append(r)

          assert queue_records, 'No WU-107 queue record evidence found in recent executions'
          assert execution_results, 'No WU-107 execution-result evidence found in recent executions'

          forbidden_exact={'parent_name','student_name','phone','email','raw_message','raw_session_id','raw_conversation','password','api_key','token','secret','card_number','bank_account'}
          forbidden_hits=[]
          for r in queue_records:
              keys=set(r.keys())
              forbidden_hits.extend(sorted(keys & forbidden_exact))
              assert r.get('handoff_schema')=='SPM_WU107_HANDOFF_RECORD_V1'
              sk=r.get('handoff_session_key')
              assert isinstance(sk,str) and sk.startswith('conv-') and len(sk)>=17
              assert r.get('raw_message_logged') is False
              assert r.get('raw_session_logged') is False
              assert r.get('raw_contact_logged') is False
              assert r.get('secret_values_logged') is False
              cs=r.get('customer_context_summary') or {}
              kc=cs.get('known_contact') or {}
              assert set(kc.keys()).issubset({'phone_present','email_present'})
              assert all(isinstance(v,bool) for v in kc.values())
          assert not forbidden_hits, 'Forbidden default queue fields present'

          queued=[r for r in execution_results if r.get('handoff_state')=='QUEUED']
          assert queued, 'No verified QUEUED execution result found'
          for r in queued:
              assert r.get('queue_receipt_verified') is True
              assert r.get('human_acceptance_verified') is False
              assert r.get('success') is True

          # Existing-queue evidence closes the internal side of same-session idempotency if present.
          idempotency_observed=False
          for d in existing_decisions:
              er=d.get('existing_record') or {}
              if er.get('handoff_state')=='QUEUED' and er.get('idempotency_key'):
                  idempotency_observed=True
                  break

          report={
            'schema':'SPM_WU107_RUNTIME_READONLY_AUDIT_V1',
            'workflow_id_verified':True,
            'n8n_write_performed':False,
            'recent_executions_examined':len(executions),
            'queue_records_examined':len(queue_records),
            'execution_results_examined':len(execution_results),
            'rt10710_pii_minimization':'PASS',
            'rt10711_queue_receipt_not_human_acceptance':'PASS',
            'rt10702_internal_idempotency_observed':'PASS' if idempotency_observed else 'NOT_OBSERVED_IN_WINDOW',
            'raw_execution_data_emitted':False
          }
          open('wu107-runtime-readonly-audit.json','w').write(json.dumps(report,indent=2)+'\n')
          print('WU107_RT10_PII_MINIMIZATION_PASS')
          print('WU107_RT11_QUEUE_RECEIPT_NOT_ACCEPTANCE_PASS')
          print('WU107_RT02_INTERNAL_IDEMPOTENCY='+report['rt10702_internal_idempotency_observed'])
          print('WU107_RUNTIME_READONLY_AUDIT_PASS')
          PY

      - name: Upload sanitized audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: wu107-runtime-readonly-audit
          path: wu107-runtime-readonly-audit.json
          if-no-files-found: error
          retention-days: 30
