name: WU-101 remote readback diagnostic

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/wu101/verify_remote_staging.py"
      - ".github/workflows/wu101-remote-readback.yml"

permissions:
  contents: read

jobs:
  readback:
    name: WU101 remote n8n readback
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_TARGET_WORKFLOW_ID: mMZVFxJIxE7a9SSW
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Read and verify remote WU-101 STAGING content
        run: |
          set -euo pipefail
          python scripts/wu101/verify_remote_staging.py
