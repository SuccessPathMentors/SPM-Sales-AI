name: WU-101 staging analytics

on:
  pull_request:
    branches:
      - main
    paths:
      - "scripts/wu101/**"
      - "contracts/WU101_CONVERSATION_ANALYTICS_EVENT_V1.schema.json"
      - "work-units/WU-101.md"
      - "docs/WU-101_PLAN.md"
      - "n8n/deployment/wu101-staging.json"
      - ".github/workflows/wu101-staging.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run performs zero n8n writes; apply may create/update only inactive STAGING"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      target_workflow_id:
        description: "Existing WU-101 STAGING workflow ID. Leave blank for the first deliberate create."
        required: false
        type: string
        default: ""
      allow_create:
        description: "Explicitly permit one-time creation when target_workflow_id is blank"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: wu101-staging-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr-validation' }}
  cancel-in-progress: false

env:
  BASELINE: n8n/workflows/production/SPM_RC4_3_3_PRODUCTION_FINAL_2026-08-28.json
  CANDIDATE: n8n/generated/SPM_WU101_STAGING_ANALYTICS_CANDIDATE.json
  EXPECTED_SHA256: c44f264b5a6ed1917b9d66a1783f2f6119ac7dbbb3921a565720c0b2b4372315

jobs:
  validate:
    name: WU101 static and privacy tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build deterministic candidate
        run: |
          set -euo pipefail
          mkdir -p n8n/generated
          python scripts/wu101/build_candidate_sheets_type_safe.py --baseline "$BASELINE" --output "$CANDIDATE"

      - name: Run WU-101 static/privacy/isolation/type-safety tests
        run: |
          set -euo pipefail
          python scripts/wu101/test_candidate.py
          python scripts/wu101/test_chat_memory_isolation.py
          python scripts/wu101/test_sheets_type_safe.py
          python scripts/wu101/test_contract_signals.py
          python scripts/wu101/test_regression_parity.py

      - name: Verify exact candidate SHA-256
        run: |
          set -euo pipefail
          actual="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"
          echo "candidate_sha256=$actual"

      - name: Existing non-production deployer dry-run
        run: |
          set -euo pipefail
          python scripts/n8n/deploy_nonprod.py \
            --artifact "$CANDIDATE" \
            --environment staging \
            --expected-sha256 "$EXPECTED_SHA256" \
            --mode dry-run \
            --result-file wu101-dry-run-result.json

      - name: Upload candidate and dry-run evidence
        uses: actions/upload-artifact@v4
        with:
          name: wu101-candidate-and-dry-run
          path: |
            n8n/generated/SPM_WU101_STAGING_ANALYTICS_CANDIDATE.json
            wu101-dry-run-result.json
          retention-days: 30

  deploy-staging:
    name: WU101 ${{ inputs.mode }} to staging
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_TARGET_WORKFLOW_ID: ${{ inputs.target_workflow_id }}
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild exact candidate
        run: |
          set -euo pipefail
          mkdir -p n8n/generated
          python scripts/wu101/build_candidate_sheets_type_safe.py --baseline "$BASELINE" --output "$CANDIDATE"
          python scripts/wu101/test_candidate.py
          python scripts/wu101/test_chat_memory_isolation.py
          python scripts/wu101/test_sheets_type_safe.py
          python scripts/wu101/test_contract_signals.py
          python scripts/wu101/test_regression_parity.py
          actual="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          test "$actual" = "$EXPECTED_SHA256"

      - name: Safety-check manual inputs
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ inputs.target_workflow_id }}" == "CMBMpxX5AqqK2UTn" ]]; then
            echo "Production workflow ID is denied" >&2
            exit 1
          fi
          if [[ "${{ inputs.mode }}" == "apply" && -z "${{ inputs.target_workflow_id }}" && "${{ inputs.allow_create }}" != "true" ]]; then
            echo "First apply with no target requires allow_create=true" >&2
            exit 1
          fi
          if [[ "${{ inputs.target_workflow_id }}" == "BIDVhNCRbj9dvH1t" ]]; then
            echo "Legacy MIG-003 canary ID is denied for WU-101" >&2
            exit 1
          fi

      - name: Run safe deployer
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --artifact "$CANDIDATE"
            --environment staging
            --expected-sha256 "$EXPECTED_SHA256"
            --mode "${{ inputs.mode }}"
            --result-file wu101-deployment-result.json
          )
          if [[ -n "${{ inputs.target_workflow_id }}" ]]; then
            args+=(--target-workflow-id "${{ inputs.target_workflow_id }}")
          fi
          if [[ "${{ inputs.allow_create }}" == "true" ]]; then
            args+=(--allow-create)
          fi
          python scripts/n8n/deploy_nonprod.py "${args[@]}"

      - name: Verify remote WU-101 STAGING content after apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          target="$(python - <<'PY'
          import json
          print(json.load(open('wu101-deployment-result.json'))['target_workflow_id'])
          PY
          )"
          N8N_TARGET_WORKFLOW_ID="$target" python scripts/wu101/verify_remote_staging.py

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu101-staging-${{ inputs.mode }}-evidence
          path: |
            n8n/generated/SPM_WU101_STAGING_ANALYTICS_CANDIDATE.json
            wu101-deployment-result.json
          if-no-files-found: ignore
          retention-days: 30
