name: WU105 CR-105-03 refund-policy diagnosis

on:
  push:
    branches:
      - wu105-planning
    paths:
      - '.github/workflows/wu105-cr10503-diagnose.yml'

permissions:
  contents: read

env:
  TARGET_WORKFLOW_ID: KXfalaYSCLdgmf4X

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only inspect WU92 validator and local topology
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['N8N_API_BASE_URL'].rstrip('/')
          key=os.environ['N8N_API_KEY']
          wid=os.environ['TARGET_WORKFLOW_ID']
          req=urllib.request.Request(f'{base}/workflows/{wid}',headers={'accept':'application/json','X-N8N-API-KEY':key},method='GET')
          with urllib.request.urlopen(req,timeout=45) as r:
              wf=json.loads(r.read().decode())
          con=wf.get('connections',{})
          incoming={}
          for src,v in con.items():
              for group in v.get('main',[]):
                  for e in group:
                      incoming.setdefault(e.get('node'),[]).append(src)
          names=['Generate WU92 Sales Agent Response','Validate + Guard WU92 Sales Agent Output','Apply WU92 Sales Agent Policy Guard','Apply WU93 Commercial Guard','Apply WU94 Scheduling Truth Guard','Apply WU105 Availability Answer-First Guard']
          nodes={n.get('name'):n for n in wf.get('nodes',[])}
          print('WORKFLOW',wf.get('id'),'active=',wf.get('active'),'nodes=',len(nodes),'version=',wf.get('versionId'))
          for name in names:
              n=nodes.get(name)
              print('\n===',name,'===')
              if not n:
                  print('MISSING'); continue
              print('TYPE',n.get('type'))
              print('IN',incoming.get(name,[]))
              print('OUT',[[x.get('node') for x in g] for g in con.get(name,{}).get('main',[])])
              if name=='Validate + Guard WU92 Sales Agent Output':
                  print('JSCODE_BEGIN')
                  print(n.get('parameters',{}).get('jsCode',''))
                  print('JSCODE_END')
          PY
