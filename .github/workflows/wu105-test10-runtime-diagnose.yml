name: WU105 Test10 runtime diagnosis

on:
  push:
    branches:
      - wu105-planning
    paths:
      - '.github/workflows/wu105-test10-runtime-diagnose.yml'

permissions:
  contents: read

env:
  TARGET_WORKFLOW_ID: KXfalaYSCLdgmf4X
  EXPECTED_PROMPT: What is your refund policy?

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only inspect latest matching WU-105 execution
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['N8N_API_BASE_URL'].rstrip('/')
          key=os.environ['N8N_API_KEY']
          wid=os.environ['TARGET_WORKFLOW_ID']
          expected=os.environ['EXPECTED_PROMPT'].strip()
          headers={'accept':'application/json','X-N8N-API-KEY':key}
          def get(url):
              req=urllib.request.Request(url,headers=headers,method='GET')
              with urllib.request.urlopen(req,timeout=45) as r:
                  return json.loads(r.read().decode())
          listing=get(f'{base}/executions?workflowId={urllib.parse.quote(wid)}&limit=12')
          rows=listing.get('data',listing if isinstance(listing,list) else [])
          print('EXECUTION_CANDIDATES',len(rows))
          matched=None
          for row in rows:
              eid=str(row.get('id'))
              try:
                  ex=get(f'{base}/executions/{eid}?includeData=true')
              except Exception as e:
                  print('EXEC_READ_ERROR',eid,type(e).__name__)
                  continue
              run=((ex.get('data') or {}).get('resultData') or {}).get('runData') or {}
              found=False
              for node,runs in run.items():
                  for rr in runs or []:
                      data=rr.get('data') or {}
                      for group in data.get('main') or []:
                          for item in group or []:
                              j=(item or {}).get('json') or {}
                              msg=str(((j.get('message') or {}).get('raw')) or '').strip()
                              if msg==expected:
                                  found=True
                                  break
                          if found: break
                      if found: break
                  if found: break
              if found:
                  matched=(eid,ex,run)
                  break
          if not matched:
              raise SystemExit('NO_MATCHING_EXECUTION_FOUND')
          eid,ex,run=matched
          print('MATCHED_EXECUTION',eid,'status=',ex.get('status'),'finished=',ex.get('finished'))
          names=[
            'Generate WU92 Sales Agent Response',
            'Validate + Guard WU92 Sales Agent Output',
            'Apply WU105 Refund Policy Answer-First Guard',
            'Apply WU92 Sales Agent Policy Guard',
            'RC3 Chat Response'
          ]
          def first_json(node):
              runs=run.get(node) or []
              for rr in reversed(runs):
                  for group in ((rr.get('data') or {}).get('main') or []):
                      for item in group or []:
                          j=(item or {}).get('json')
                          if isinstance(j,dict): return j
              return {}
          for n in names:
              j=first_json(n)
              print('\nNODE',n,'PRESENT',bool(j))
              if not j: continue
              if n=='Generate WU92 Sales Agent Response':
                  raw=j.get('output',j.get('text',j.get('response',None)))
                  if isinstance(raw,str):
                      try: raw=json.loads(raw.strip().removeprefix('```json').removesuffix('```').strip())
                      except Exception: pass
                  if isinstance(raw,dict):
                      print('RAW_ANSWER',str(raw.get('answer_text',''))[:1200])
                      print('RAW_PROPOSED_ACTION',raw.get('proposed_action'))
                      print('RAW_ACTION_REQUIRES_GATEWAY',raw.get('action_requires_gateway'))
              cls=j.get('classification') or {}
              sd=j.get('source_gate_decision') or {}
              out=j.get('sales_agent_output') or {}
              g=j.get('wu105_refund_policy_guard') or {}
              if cls: print('INTENT',cls.get('spm_intent'),'LANG',cls.get('language'))
              if sd: print('SOURCE_CAN_ANSWER',sd.get('can_answer'),'OP_CLAIMS_BLOCKED',sd.get('operational_claims_blocked'),'LIVE_REQUIRED',sd.get('live_verification_required'))
              if out:
                  print('SAFETY_REWRITE',out.get('safety_rewrite_applied'))
                  print('OUT_ACTION',out.get('proposed_action'),'OUT_GATEWAY',out.get('action_requires_gateway'))
                  print('OUT_ANSWER',str(out.get('answer_text',''))[:1200])
              if g:
                  print('CR10503_STATUS',g.get('status'),'APPLIED',g.get('applied'))
                  print('CR10503_POLICY_INFO',g.get('policy_information_request'),'EXPLICIT_ACTION',g.get('explicit_refund_action'),'SOURCE',g.get('source_can_answer'),'UPSTREAM_REWRITE',g.get('upstream_safety_rewrite'),'RAW_PRESENT',g.get('original_model_answer_present'))
          PY
