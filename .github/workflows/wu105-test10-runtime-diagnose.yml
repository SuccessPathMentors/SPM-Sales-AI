name: WU105 Test10 source-loader diagnosis

on:
  push:
    branches:
      - wu105-planning
    paths:
      - '.github/workflows/wu105-test10-runtime-diagnose.yml'

permissions:
  contents: read

env:
  TARGET_WORKFLOW_ID: KXfalaYSCLdgmf4X

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only inspect WU91 Google Sheets source loaders
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['N8N_API_BASE_URL'].rstrip('/')
          key=os.environ['N8N_API_KEY']
          wid=os.environ['TARGET_WORKFLOW_ID']
          req=urllib.request.Request(f'{base}/workflows/{wid}',headers={'accept':'application/json','X-N8N-API-KEY':key},method='GET')
          with urllib.request.urlopen(req,timeout=45) as r:
              wf=json.loads(r.read().decode())
          con=wf.get('connections',{})
          incoming={}
          for src,v in con.items():
              for group in v.get('main',[]):
                  for e in group:
                      incoming.setdefault(e.get('node'),[]).append(src)
          print('WORKFLOW',wf.get('id'),'active=',wf.get('active'),'nodes=',len(wf.get('nodes',[])),'version=',wf.get('versionId'))
          for n in wf.get('nodes',[]):
              name=n.get('name','')
              typ=n.get('type','')
              if typ=='n8n-nodes-base.googleSheets' and ('WU91' in name or 'POLIC' in name.upper() or 'CONFIG' in name.upper()):
                  print('\nNODE',name)
                  print('IN',incoming.get(name,[]))
                  print('OUT',[[x.get('node') for x in g] for g in con.get(name,{}).get('main',[])])
                  p=n.get('parameters',{})
                  safe={k:v for k,v in p.items() if k not in ['authentication']}
                  print('PARAMS',json.dumps(safe,ensure_ascii=False,indent=2)[:12000])
                  creds=n.get('credentials',{})
                  print('CREDENTIAL_TYPES',list(creds.keys()))
          PY
