name: WU105 Test10 topology diagnosis

on:
  push:
    branches:
      - wu105-planning
    paths:
      - '.github/workflows/wu105-test10-runtime-diagnose.yml'

permissions:
  contents: read

env:
  TARGET_WORKFLOW_ID: KXfalaYSCLdgmf4X

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read-only inspect refund-related runtime topology and guards
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['N8N_API_BASE_URL'].rstrip('/')
          key=os.environ['N8N_API_KEY']
          wid=os.environ['TARGET_WORKFLOW_ID']
          req=urllib.request.Request(f'{base}/workflows/{wid}',headers={'accept':'application/json','X-N8N-API-KEY':key},method='GET')
          with urllib.request.urlopen(req,timeout=45) as r:
              wf=json.loads(r.read().decode())
          nodes={n.get('name'):n for n in wf.get('nodes',[])}
          con=wf.get('connections',{})
          incoming={}
          for src,v in con.items():
              for group in v.get('main',[]):
                  for e in group:
                      incoming.setdefault(e.get('node'),[]).append(src)
          print('WORKFLOW',wf.get('id'),'active=',wf.get('active'),'nodes=',len(nodes),'version=',wf.get('versionId'))
          focus=[
            'Validate + Guard WU92 Sales Agent Output',
            'Apply WU105 Refund Policy Answer-First Guard',
            'Apply WU92 Sales Agent Policy Guard',
            'Apply WU93 Commercial Guard',
            'Apply WU94 Scheduling Truth Guard',
            'Apply WU105 Availability Answer-First Guard',
            'Resolve WU95 Conversion Mode',
            'RC3 Chat Response'
          ]
          for name in focus:
              n=nodes.get(name)
              print('\n===',name,'===')
              if not n:
                  print('MISSING'); continue
              print('IN',incoming.get(name,[]))
              print('OUT',[[x.get('node') for x in g] for g in con.get(name,{}).get('main',[])])
              code=n.get('parameters',{}).get('jsCode','')
              if code:
                  print('CODE_BEGIN')
                  print(code)
                  print('CODE_END')
          print('\n=== ALL REFUND/CLASSIFIER/SOURCE NODES ===')
          for name,n in nodes.items():
              p=json.dumps(n.get('parameters',{}),ensure_ascii=False)
              hay=(name+' '+p).lower()
              if ('refund_policy' in hay or 'refund policy' in hay or 'source_gate' in hay or 'classifier' in name.lower() or 'classification' in name.lower()):
                  print('\nNODE',name,'TYPE',n.get('type'))
                  print('IN',incoming.get(name,[]))
                  print('OUT',[[x.get('node') for x in g] for g in con.get(name,{}).get('main',[])])
                  code=n.get('parameters',{}).get('jsCode','')
                  if code:
                      # Keep logs focused on relevant code.
                      lows=code.lower()
                      for needle in ['refund_policy','refund policy','source_gate','classification','spm_intent']:
                          idx=lows.find(needle)
                          if idx>=0:
                              lo=max(0,idx-1000); hi=min(len(code),idx+2200)
                              print('SNIPPET',code[lo:hi])
                              break
          PY
