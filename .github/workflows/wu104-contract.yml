name: WU-104 short query contract

on:
  pull_request:
    paths:
      - 'contracts/WU104_*'
      - 'scripts/wu104/**'
      - 'work-units/WU-104.md'
      - '.github/workflows/wu104-contract.yml'
  push:
    branches:
      - 'wu104-implementation'
    paths:
      - 'contracts/WU104_*'
      - 'scripts/wu104/**'
      - 'work-units/WU-104.md'
      - '.github/workflows/wu104-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: WU-104 contracts
        run: python scripts/wu104/test_contracts.py
      - name: WU-104 deterministic core
        run: python scripts/wu104/test_core.py
