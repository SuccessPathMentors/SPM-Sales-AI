name: WU-106 end-to-end journey staging

on:
  pull_request:
    branches:
      - main
    paths:
      - "contracts/WU106_*"
      - "scripts/wu106/**"
      - "work-units/WU-105.lock.md"
      - "work-units/WU-106.md"
      - ".github/workflows/wu106-staging.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run performs zero n8n writes; apply may create/update only inactive WU-106 STAGING"
        required: true
        type: choice
        default: dry-run
        options:
          - dry-run
          - apply
      target_workflow_id:
        description: "Existing WU-106 STAGING workflow ID. Leave blank only for first deliberate create."
        required: false
        type: string
        default: ""
      allow_create:
        description: "Explicitly permit one-time WU-106 STAGING creation when target_workflow_id is blank"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: wu106-staging-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr-validation' }}
  cancel-in-progress: false

env:
  WU104_LOCK_RUN_ID: '33663124381'
  WU104_ARTIFACT_NAME: wu104-cr10405-evidence
  WU104_UPSTREAM: locked-wu104/n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  WU104_EXPECTED_SHA256: 32721cae2b09531d8f4860373c37911ace9e95b6818babdca880fa08ef1b7bc9
  CR10501: /tmp/SPM_WU105_CR10501.json
  CR10501_SHA: e40610b13ec61a781acf44842b74955a88a11286e83baa7e121aee349cc9dcf0
  CR10502: /tmp/SPM_WU105_CR10502.json
  CR10502_SHA: 7fc201137671b1cd47f9fc6b4ec60a9b563b2bae7c0776952ec68e0988bfed1e
  CR10503: /tmp/SPM_WU105_CR10503.json
  CR10503_SHA: aaaa139faa67815f4196fb9779232471c4c8b051a26f0ba0a3be4c56231d4653
  WU105_FINAL: /tmp/SPM_WU105_FINAL_CR10504.json
  WU105_FINAL_SHA: 42ba2b9de1f52c0db1fc32e59974dc40ebce80b787677ac6b0d4418a6315bca1
  CANDIDATE: n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
  FINAL_SHA: 134b2d861d6c5060ca52d8fd838b2cdd7d5d88ffa74855e3de1665e302afda67
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn
  WU101_STAGING_ID: mMZVFxJIxE7a9SSW
  WU102_STAGING_ID: 1kaRBBFVJYbPxvQG
  WU103_STAGING_ID: 5COEoxXjk8AvuGBa
  WU104_STAGING_ID: Bt3PvOIbFzU0O9gk
  WU105_STAGING_ID: KXfalaYSCLdgmf4X

jobs:
  validate:
    name: WU106 exact candidate and non-production dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.build.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact locked WU-104 CR-104-05 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}

      - name: Verify formal WU-105 lock and exact WU-104 artifact
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:work-units/WU-105.lock.md > /tmp/WU-105.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-105.lock.md
          grep -q "$WU105_FINAL_SHA" /tmp/WU-105.lock.md
          test "$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')" = "$WU104_EXPECTED_SHA256"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["WU104_UPSTREAM"]))["nodes"]))')" = "126"

      - name: Rebuild exact locked WU-105 CR-105-04 lineage
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu105/build_candidate.py --baseline "$WU104_UPSTREAM" --manifest contracts/WU105_GOLDEN_INTENTS_V1.json --output "$CR10501"
          test "$(sha256sum "$CR10501" | awk '{print $1}')" = "$CR10501_SHA"
          python scripts/wu105/apply_cr10502.py --input "$CR10501" --output "$CR10502"
          test "$(sha256sum "$CR10502" | awk '{print $1}')" = "$CR10502_SHA"
          python scripts/wu105/apply_cr10503.py --input "$CR10502" --output "$CR10503"
          test "$(sha256sum "$CR10503" | awk '{print $1}')" = "$CR10503_SHA"
          python scripts/wu105/apply_cr10504.py --input "$CR10503" --output "$WU105_FINAL"
          test "$(sha256sum "$WU105_FINAL" | awk '{print $1}')" = "$WU105_FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["WU105_FINAL"]))["nodes"]))')" = "131"

      - name: Build and verify exact WU-106 observe-only candidate
        id: build
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu106/test_journey_manifest.py
          python scripts/wu106/test_state_contract.py
          python scripts/wu106/test_runtime_matrix.py
          mkdir -p n8n/generated
          python scripts/wu106/build_candidate.py --baseline "$WU105_FINAL" --output "$CANDIDATE"
          python scripts/wu106/test_candidate.py --baseline "$WU105_FINAL" --candidate "$CANDIDATE"
          actual="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          echo "WU106_FINAL_CANDIDATE_SHA256=$actual"
          test "$actual" = "$FINAL_SHA"
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CANDIDATE"]))["nodes"]))')" = "132"
          python - <<'PY'
          import json, os
          identity=json.load(open('contracts/WU106_CANDIDATE_IDENTITY_V1.json'))
          assert identity['candidate_sha256']==os.environ['FINAL_SHA']
          assert identity['node_count']==132
          assert identity['deployment']['production_mutation_allowed'] is False
          print('WU106_CANDIDATE_IDENTITY_PASS')
          PY

      - name: Existing non-production deployer dry-run
        run: |
          set -euo pipefail
          python scripts/n8n/deploy_nonprod.py \
            --artifact "$CANDIDATE" \
            --environment staging \
            --expected-sha256 "${{ steps.build.outputs.sha }}" \
            --mode dry-run \
            --result-file wu106-dry-run-result.json

      - name: Upload WU-106 candidate and dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu106-candidate-and-dry-run
          path: |
            n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
            contracts/WU106_CANDIDATE_IDENTITY_V1.json
            contracts/WU106_RUNTIME_MATRIX_V1.json
            wu106-dry-run-result.json
          if-no-files-found: ignore
          retention-days: 30

  deploy-staging:
    name: WU106 ${{ inputs.mode }} to staging
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_TARGET_WORKFLOW_ID: ${{ inputs.target_workflow_id }}
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact locked WU-104 CR-104-05 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}

      - name: Re-verify formal WU-105 lock before any write
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:work-units/WU-105.lock.md > /tmp/WU-105.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-105.lock.md
          grep -q "$WU105_FINAL_SHA" /tmp/WU-105.lock.md
          test "$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')" = "$WU104_EXPECTED_SHA256"

      - name: Rebuild exact WU-106 candidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu105/build_candidate.py --baseline "$WU104_UPSTREAM" --manifest contracts/WU105_GOLDEN_INTENTS_V1.json --output "$CR10501"
          test "$(sha256sum "$CR10501" | awk '{print $1}')" = "$CR10501_SHA"
          python scripts/wu105/apply_cr10502.py --input "$CR10501" --output "$CR10502"
          test "$(sha256sum "$CR10502" | awk '{print $1}')" = "$CR10502_SHA"
          python scripts/wu105/apply_cr10503.py --input "$CR10502" --output "$CR10503"
          test "$(sha256sum "$CR10503" | awk '{print $1}')" = "$CR10503_SHA"
          python scripts/wu105/apply_cr10504.py --input "$CR10503" --output "$WU105_FINAL"
          test "$(sha256sum "$WU105_FINAL" | awk '{print $1}')" = "$WU105_FINAL_SHA"
          mkdir -p n8n/generated
          python scripts/wu106/build_candidate.py --baseline "$WU105_FINAL" --output "$CANDIDATE"
          python scripts/wu106/test_candidate.py --baseline "$WU105_FINAL" --candidate "$CANDIDATE"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "${{ needs.validate.outputs.candidate_sha }}"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "$FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CANDIDATE"]))["nodes"]))')" = "132"

      - name: Hard-stop protected target checks
        shell: bash
        run: |
          set -euo pipefail
          target="${{ inputs.target_workflow_id }}"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$WU101_STAGING_ID" "$WU102_STAGING_ID" "$WU103_STAGING_ID" "$WU104_STAGING_ID" "$WU105_STAGING_ID"; do
            if [[ "$target" == "$denied" ]]; then
              echo "Denied protected workflow ID: $target" >&2
              exit 1
            fi
          done
          if [[ "${{ inputs.mode }}" == "apply" && -z "$target" && "${{ inputs.allow_create }}" != "true" ]]; then
            echo "First WU-106 apply with no target requires allow_create=true" >&2
            exit 1
          fi
          if [[ "${{ inputs.allow_create }}" == "true" && -n "$target" ]]; then
            echo "allow_create=true is permitted only when target_workflow_id is blank" >&2
            exit 1
          fi

      - name: Run safe non-production deployer
        shell: bash
        run: |
          set -euo pipefail
          args=(
            --artifact "$CANDIDATE"
            --environment staging
            --expected-sha256 "${{ needs.validate.outputs.candidate_sha }}"
            --mode "${{ inputs.mode }}"
            --result-file wu106-deployment-result.json
          )
          if [[ -n "${{ inputs.target_workflow_id }}" ]]; then
            args+=(--target-workflow-id "${{ inputs.target_workflow_id }}")
          fi
          if [[ "${{ inputs.allow_create }}" == "true" ]]; then
            args+=(--allow-create)
          fi
          python scripts/n8n/deploy_nonprod.py "${args[@]}"

      - name: Verify remote WU-106 STAGING content after apply
        if: inputs.mode == 'apply'
        shell: bash
        run: |
          set -euo pipefail
          target="$(python - <<'PY'
          import json
          print(json.load(open('wu106-deployment-result.json'))['target_workflow_id'])
          PY
          )"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$WU101_STAGING_ID" "$WU102_STAGING_ID" "$WU103_STAGING_ID" "$WU104_STAGING_ID" "$WU105_STAGING_ID"; do
            test "$target" != "$denied"
          done
          N8N_TARGET_WORKFLOW_ID="$target" python scripts/wu106/verify_remote_staging.py

      - name: Upload WU-106 STAGING deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu106-staging-${{ inputs.mode }}-evidence
          path: |
            n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
            contracts/WU106_CANDIDATE_IDENTITY_V1.json
            contracts/WU106_RUNTIME_MATRIX_V1.json
            wu106-deployment-result.json
          if-no-files-found: ignore
          retention-days: 30
