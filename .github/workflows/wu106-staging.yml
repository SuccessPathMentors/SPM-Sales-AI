name: WU-106 end-to-end journey staging

on:
  pull_request:
    branches: [main]
    paths:
      - "contracts/WU106_*"
      - "scripts/wu106/**"
      - "work-units/WU-105.lock.md"
      - "work-units/WU-106.md"
      - ".github/workflows/wu106-staging.yml"
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run performs zero n8n writes; apply updates only the existing inactive WU-106 STAGING workflow"
        required: true
        type: choice
        default: dry-run
        options: [dry-run, apply]

permissions:
  contents: read
  actions: read

concurrency:
  group: wu106-staging-${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'pr-validation' }}
  cancel-in-progress: false

env:
  WU104_LOCK_RUN_ID: '33663124381'
  WU104_ARTIFACT_NAME: wu104-cr10405-evidence
  WU104_UPSTREAM: locked-wu104/n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  WU104_EXPECTED_SHA256: 32721cae2b09531d8f4860373c37911ace9e95b6818babdca880fa08ef1b7bc9
  CR10501: /tmp/SPM_WU105_CR10501.json
  CR10501_SHA: e40610b13ec61a781acf44842b74955a88a11286e83baa7e121aee349cc9dcf0
  CR10502: /tmp/SPM_WU105_CR10502.json
  CR10502_SHA: 7fc201137671b1cd47f9fc6b4ec60a9b563b2bae7c0776952ec68e0988bfed1e
  CR10503: /tmp/SPM_WU105_CR10503.json
  CR10503_SHA: aaaa139faa67815f4196fb9779232471c4c8b051a26f0ba0a3be4c56231d4653
  WU105_FINAL: /tmp/SPM_WU105_FINAL_CR10504.json
  WU105_FINAL_SHA: 42ba2b9de1f52c0db1fc32e59974dc40ebce80b787677ac6b0d4418a6315bca1
  WU106_BASELINE: /tmp/SPM_WU106_OBSERVE_ONLY_BASELINE.json
  WU106_BASELINE_SHA: 134b2d861d6c5060ca52d8fd838b2cdd7d5d88ffa74855e3de1665e302afda67
  CR10601: /tmp/SPM_WU106_CR10601.json
  CR10601_SHA: 5db680c1e2b51d35408f78077ef4bb098da542bdf5e071125532948ad6783e2e
  CR10602: /tmp/SPM_WU106_CR10602.json
  CR10602_SHA: 50dbf22e2496e3c1b0ce7c9ff37edab752dbf6b69ddc62f80026942b31146014
  CANDIDATE: n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
  FINAL_SHA: 2e219adbdd612106b782993cbcb2f94da6c0737b250264060b473f12f0fcc81f
  EXPECTED_WU106_STAGING_ID: vvHvidUHVxM5wTVT
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn
  WU101_STAGING_ID: mMZVFxJIxE7a9SSW
  WU102_STAGING_ID: 1kaRBBFVJYbPxvQG
  WU103_STAGING_ID: 5COEoxXjk8AvuGBa
  WU104_STAGING_ID: Bt3PvOIbFzU0O9gk
  WU105_STAGING_ID: KXfalaYSCLdgmf4X

jobs:
  validate:
    name: WU106 CR-106-03 final candidate and non-production dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate_sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact locked WU-104 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}
      - name: Rebuild exact locked lineage through CR-106-03
        id: build
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:work-units/WU-105.lock.md > /tmp/WU-105.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-105.lock.md
          grep -q "$WU105_FINAL_SHA" /tmp/WU-105.lock.md
          test "$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')" = "$WU104_EXPECTED_SHA256"
          python scripts/wu105/build_candidate.py --baseline "$WU104_UPSTREAM" --manifest contracts/WU105_GOLDEN_INTENTS_V1.json --output "$CR10501"
          test "$(sha256sum "$CR10501" | awk '{print $1}')" = "$CR10501_SHA"
          python scripts/wu105/apply_cr10502.py --input "$CR10501" --output "$CR10502"
          test "$(sha256sum "$CR10502" | awk '{print $1}')" = "$CR10502_SHA"
          python scripts/wu105/apply_cr10503.py --input "$CR10502" --output "$CR10503"
          test "$(sha256sum "$CR10503" | awk '{print $1}')" = "$CR10503_SHA"
          python scripts/wu105/apply_cr10504.py --input "$CR10503" --output "$WU105_FINAL"
          test "$(sha256sum "$WU105_FINAL" | awk '{print $1}')" = "$WU105_FINAL_SHA"
          python scripts/wu106/build_candidate.py --baseline "$WU105_FINAL" --output "$WU106_BASELINE"
          test "$(sha256sum "$WU106_BASELINE" | awk '{print $1}')" = "$WU106_BASELINE_SHA"
          python scripts/wu106/apply_cr10601.py --input "$WU106_BASELINE" --output "$CR10601"
          python scripts/wu106/test_cr10601.py --candidate "$CR10601"
          test "$(sha256sum "$CR10601" | awk '{print $1}')" = "$CR10601_SHA"
          python scripts/wu106/apply_cr10602.py --input "$CR10601" --output "$CR10602"
          python scripts/wu106/test_cr10602.py --candidate "$CR10602"
          test "$(sha256sum "$CR10602" | awk '{print $1}')" = "$CR10602_SHA"
          mkdir -p n8n/generated
          python scripts/wu106/apply_cr10603.py --input "$CR10602" --output "$CANDIDATE"
          python scripts/wu106/test_cr10603.py --candidate "$CANDIDATE"
          actual="$(sha256sum "$CANDIDATE" | awk '{print $1}')"
          test "$actual" = "$FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CANDIDATE"]))["nodes"]))')" = "141"
          python scripts/wu106/test_journey_manifest.py
          python scripts/wu106/test_state_contract.py
          python scripts/wu106/test_runtime_matrix.py
          python - <<'PY'
          import json,os
          d=json.load(open('contracts/WU106_CR10603_IDENTITY_V1.json'))
          assert d['candidate']['candidate_sha256']==os.environ['FINAL_SHA']
          assert d['candidate']['node_count']==141
          assert d['target_staging']['workflow_id']==os.environ['EXPECTED_WU106_STAGING_ID']
          assert d['candidate']['production_mutation_allowed'] is False
          print('WU106_CR10603_IDENTITY_PASS')
          PY
          echo "sha=$actual" >> "$GITHUB_OUTPUT"
      - name: Non-production deployer dry-run
        run: python scripts/n8n/deploy_nonprod.py --artifact "$CANDIDATE" --environment staging --expected-sha256 "${{ steps.build.outputs.sha }}" --target-workflow-id "$EXPECTED_WU106_STAGING_ID" --mode dry-run --result-file wu106-dry-run-result.json
      - name: Upload CR-106-03 dry-run evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu106-cr10603-final-candidate-and-dry-run
          path: |
            n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
            contracts/WU106_CR10603_IDENTITY_V1.json
            contracts/WU106_RUNTIME_MATRIX_V1.json
            wu106-dry-run-result.json
          if-no-files-found: ignore
          retention-days: 30

  deploy-staging:
    name: WU106 CR-106-03 ${{ inputs.mode }} to existing staging
    if: github.event_name == 'workflow_dispatch'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_TARGET_WORKFLOW_ID: vvHvidUHVxM5wTVT
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Download exact locked WU-104 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}
      - name: Rebuild exact CR-106-03 candidate before any write
        shell: bash
        run: |
          set -euo pipefail
          test "$N8N_TARGET_WORKFLOW_ID" = "$EXPECTED_WU106_STAGING_ID"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$WU101_STAGING_ID" "$WU102_STAGING_ID" "$WU103_STAGING_ID" "$WU104_STAGING_ID" "$WU105_STAGING_ID"; do test "$N8N_TARGET_WORKFLOW_ID" != "$denied"; done
          git show origin/main:work-units/WU-105.lock.md > /tmp/WU-105.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-105.lock.md
          python scripts/wu105/build_candidate.py --baseline "$WU104_UPSTREAM" --manifest contracts/WU105_GOLDEN_INTENTS_V1.json --output "$CR10501"
          test "$(sha256sum "$CR10501" | awk '{print $1}')" = "$CR10501_SHA"
          python scripts/wu105/apply_cr10502.py --input "$CR10501" --output "$CR10502"
          test "$(sha256sum "$CR10502" | awk '{print $1}')" = "$CR10502_SHA"
          python scripts/wu105/apply_cr10503.py --input "$CR10502" --output "$CR10503"
          test "$(sha256sum "$CR10503" | awk '{print $1}')" = "$CR10503_SHA"
          python scripts/wu105/apply_cr10504.py --input "$CR10503" --output "$WU105_FINAL"
          test "$(sha256sum "$WU105_FINAL" | awk '{print $1}')" = "$WU105_FINAL_SHA"
          python scripts/wu106/build_candidate.py --baseline "$WU105_FINAL" --output "$WU106_BASELINE"
          test "$(sha256sum "$WU106_BASELINE" | awk '{print $1}')" = "$WU106_BASELINE_SHA"
          python scripts/wu106/apply_cr10601.py --input "$WU106_BASELINE" --output "$CR10601"
          test "$(sha256sum "$CR10601" | awk '{print $1}')" = "$CR10601_SHA"
          python scripts/wu106/apply_cr10602.py --input "$CR10601" --output "$CR10602"
          python scripts/wu106/test_cr10602.py --candidate "$CR10602"
          test "$(sha256sum "$CR10602" | awk '{print $1}')" = "$CR10602_SHA"
          mkdir -p n8n/generated
          python scripts/wu106/apply_cr10603.py --input "$CR10602" --output "$CANDIDATE"
          python scripts/wu106/test_cr10603.py --candidate "$CANDIDATE"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "$FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CANDIDATE"]))["nodes"]))')" = "141"
      - name: Apply only to existing inactive WU-106 STAGING
        if: inputs.mode == 'apply'
        run: python scripts/n8n/deploy_nonprod.py --artifact "$CANDIDATE" --environment staging --expected-sha256 "$FINAL_SHA" --target-workflow-id "$EXPECTED_WU106_STAGING_ID" --mode apply --result-file wu106-deployment-result.json
      - name: Dry-run when requested
        if: inputs.mode == 'dry-run'
        run: python scripts/n8n/deploy_nonprod.py --artifact "$CANDIDATE" --environment staging --expected-sha256 "$FINAL_SHA" --target-workflow-id "$EXPECTED_WU106_STAGING_ID" --mode dry-run --result-file wu106-deployment-result.json
      - name: Verify remote CR-106-03 after apply
        if: inputs.mode == 'apply'
        run: N8N_TARGET_WORKFLOW_ID="$EXPECTED_WU106_STAGING_ID" python scripts/wu106/verify_remote_staging.py
      - name: Upload WU-106 CR-106-03 deployment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu106-cr10603-staging-${{ inputs.mode }}-evidence
          path: |
            n8n/generated/SPM_WU106_STAGING_END_TO_END_JOURNEYS_CANDIDATE.json
            contracts/WU106_CR10603_IDENTITY_V1.json
            wu106-deployment-result.json
          if-no-files-found: ignore
          retention-days: 30
