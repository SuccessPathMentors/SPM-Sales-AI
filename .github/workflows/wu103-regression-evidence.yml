name: WU-103 regression evidence

on:
  pull_request:
    paths:
      - 'evidence/wu103/**'
      - 'scripts/wu103/verify_regression_evidence.py'
      - '.github/workflows/wu103-regression-evidence.yml'
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify WU103 regression evidence
        run: python scripts/wu103/verify_regression_evidence.py
