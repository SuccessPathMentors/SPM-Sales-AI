name: WU105 final automated regression

on:
  push:
    branches:
      - wu105-planning
    paths:
      - '.github/workflows/wu105-final-regression.yml'

permissions:
  contents: read
  actions: read

env:
  WU104_LOCK_RUN_ID: '33663124381'
  WU104_ARTIFACT_NAME: wu104-cr10405-evidence
  WU104_UPSTREAM: locked-wu104/n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  WU104_EXPECTED_SHA256: 32721cae2b09531d8f4860373c37911ace9e95b6818babdca880fa08ef1b7bc9
  CR10501: /tmp/SPM_WU105_CR10501.json
  CR10501_SHA: e40610b13ec61a781acf44842b74955a88a11286e83baa7e121aee349cc9dcf0
  CR10502: /tmp/SPM_WU105_CR10502.json
  CR10502_SHA: 7fc201137671b1cd47f9fc6b4ec60a9b563b2bae7c0776952ec68e0988bfed1e
  CR10503: /tmp/SPM_WU105_CR10503.json
  CR10503_SHA: aaaa139faa67815f4196fb9779232471c4c8b051a26f0ba0a3be4c56231d4653
  FINAL: n8n/generated/SPM_WU105_STAGING_GOLDEN_INTENTS_CANDIDATE.json
  FINAL_SHA: 42ba2b9de1f52c0db1fc32e59974dc40ebce80b787677ac6b0d4418a6315bca1
  WU105_TARGET_WORKFLOW_ID: KXfalaYSCLdgmf4X
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn

jobs:
  final-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      N8N_TARGET_WORKFLOW_ID: KXfalaYSCLdgmf4X
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download exact locked WU-104 CR-104-05 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}

      - name: Verify formal WU-104 lock and immutable upstream
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:work-units/WU-104.lock.md > /tmp/WU-104.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-104.lock.md
          grep -q "$WU104_EXPECTED_SHA256" /tmp/WU-104.lock.md
          actual="$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')"
          test "$actual" = "$WU104_EXPECTED_SHA256"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["WU104_UPSTREAM"]))["nodes"]))')" = "126"
          echo "PASS locked WU-104 upstream $actual / 126 nodes"

      - name: Validate Golden manifest and 104-scenario matrix contract
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu105/test_manifest.py
          python scripts/wu105/test_runtime_matrix.py

      - name: Rebuild and test CR-105-01 exact candidate
        shell: bash
        run: |
          set -euo pipefail
          WU104_UPSTREAM="$WU104_UPSTREAM" python scripts/wu105/test_candidate.py
          python scripts/wu105/build_candidate.py \
            --baseline "$WU104_UPSTREAM" \
            --manifest contracts/WU105_GOLDEN_INTENTS_V1.json \
            --output "$CR10501"
          test "$(sha256sum "$CR10501" | awk '{print $1}')" = "$CR10501_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CR10501"]))["nodes"]))')" = "128"

      - name: Rebuild and test CR-105-02 multilingual free-trial guard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu105/test_cr10502.py --input "$CR10501"
          python scripts/wu105/apply_cr10502.py --input "$CR10501" --output "$CR10502"
          test "$(sha256sum "$CR10502" | awk '{print $1}')" = "$CR10502_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CR10502"]))["nodes"]))')" = "129"

      - name: Rebuild and test CR-105-03 refund-policy safety guard
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu105/test_cr10503.py --input "$CR10502"
          python scripts/wu105/apply_cr10503.py --input "$CR10502" --output "$CR10503"
          test "$(sha256sum "$CR10503" | awk '{print $1}')" = "$CR10503_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CR10503"]))["nodes"]))')" = "130"

      - name: Rebuild and test CR-105-04 policy source wiring
        shell: bash
        run: |
          set -euo pipefail
          python scripts/wu105/test_cr10504.py --input "$CR10503"
          mkdir -p n8n/generated
          python scripts/wu105/apply_cr10504.py --input "$CR10503" --output "$FINAL"
          test "$(sha256sum "$FINAL" | awk '{print $1}')" = "$FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["FINAL"]))["nodes"]))')" = "131"
          python - <<'PY'
          import json, os
          matrix=json.load(open('contracts/WU105_RUNTIME_MATRIX_V1.json'))
          assert matrix['candidate_sha256']==os.environ['FINAL_SHA']
          assert len(matrix['intents'])==13
          assert sum(3 for _ in matrix['intents'])==39
          assert len(matrix['intents'])*8==104
          print('PASS matrix -> exact final SHA, 13 intents, 39 multilingual direct prompts, 104 planned scenarios')
          PY

      - name: Final candidate non-Golden and action-safety invariants
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          wf=json.load(open(os.environ['FINAL']))
          nodes={n['name']:n for n in wf['nodes']}
          overlay=nodes['Apply WU105 Golden Intent Prompt Overlay']['parameters']['jsCode']
          assert "contract=goldenMap[intent]||null" in overlay
          assert "if(!contract)" in overlay
          assert "irreversible_action_allowed:false" in overlay
          assert "source_action_gates_authoritative:true" in overlay
          assert "max_followup_questions:1" in overlay
          assert wf.get('active') is False
          types=[n.get('type') for n in wf['nodes']]
          # no second WU-105 model/classifier was introduced by CR chain
          assert sum(1 for n in wf['nodes'] if 'WU105' in n.get('name','') and n.get('type') in {
            '@n8n/n8n-nodes-langchain.lmChatOpenAi',
            '@n8n/n8n-nodes-langchain.chainLlm',
            '@n8n/n8n-nodes-langchain.agent'})==0
          print('PASS non-Golden overlay inert path and irreversible-action invariants')
          PY

      - name: Remote read-only verification of current inactive WU-105 STAGING
        shell: bash
        run: |
          set -euo pipefail
          test "$WU105_TARGET_WORKFLOW_ID" != "$PRODUCTION_WORKFLOW_ID"
          N8N_TARGET_WORKFLOW_ID="$WU105_TARGET_WORKFLOW_ID" python scripts/wu105/verify_cr10504_remote.py

      - name: Record read-only Production and STAGING identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          base=os.environ['N8N_API_BASE_URL'].rstrip('/')
          key=os.environ['N8N_API_KEY']
          out={}
          for label,wid in [('production',os.environ['PRODUCTION_WORKFLOW_ID']),('wu105_staging',os.environ['WU105_TARGET_WORKFLOW_ID'])]:
              req=urllib.request.Request(f'{base}/workflows/{wid}',headers={'accept':'application/json','X-N8N-API-KEY':key},method='GET')
              with urllib.request.urlopen(req,timeout=45) as r:
                  wf=json.loads(r.read().decode())
              out[label]={
                  'id':wf.get('id'),
                  'name':wf.get('name'),
                  'active':wf.get('active'),
                  'versionId':wf.get('versionId'),
                  'node_count':len(wf.get('nodes',[])),
              }
          assert out['production']['id']==os.environ['PRODUCTION_WORKFLOW_ID']
          assert out['wu105_staging']['id']==os.environ['WU105_TARGET_WORKFLOW_ID']
          assert out['wu105_staging']['active'] is False
          json.dump(out,open('wu105-final-remote-identities.json','w'),indent=2)
          print(json.dumps(out,indent=2))
          PY

      - name: Build final regression summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          summary={
            'schema':'SPM_WU105_FINAL_REGRESSION_SUMMARY_V1',
            'final_candidate_sha256':os.environ['FINAL_SHA'],
            'final_node_count':131,
            'manual_customer_output_tests':{'attempted':14,'current_pass':14,'status':'PASS'},
            'matrix_contract':{
              'golden_intents':13,
              'planned_scenarios':104,
              'multilingual_direct_prompts':39,
              'status':'PASS_CONTRACT_COVERAGE'
            },
            'deterministic_cr_chain':{
              'cr10501':'PASS','cr10502':'PASS','cr10503':'PASS','cr10504':'PASS'
            },
            'remote_staging_readback':'PASS',
            'staging_active':False,
            'production_write_performed':False,
            'important_scope_note':'The 104-case automation validates matrix coverage, deterministic guards, topology, source/action invariants and remote candidate identity. It is not 104 separate live LLM chat executions; representative live customer-output acceptance is provided by the 14 owner-reviewed Test Chat cases.'
          }
          json.dump(summary,open('wu105-final-regression-summary.json','w'),indent=2)
          print(json.dumps(summary,indent=2))
          PY

      - name: Upload final regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu105-final-regression-evidence
          path: |
            n8n/generated/SPM_WU105_STAGING_GOLDEN_INTENTS_CANDIDATE.json
            contracts/WU105_RUNTIME_MATRIX_V1.json
            wu105-final-remote-identities.json
            wu105-final-regression-summary.json
          if-no-files-found: ignore
          retention-days: 30
