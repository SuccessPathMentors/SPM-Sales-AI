name: WU-107 one-time inactive STAGING creation

on:
  push:
    branches: [wu107-human-handoff]
    paths:
      - '.github/workflows/wu107-one-time-staging-create.yml'

permissions:
  contents: read
  actions: read

concurrency:
  group: wu107-one-time-staging-create
  cancel-in-progress: false

env:
  WU104_LOCK_RUN_ID: '33663124381'
  WU104_ARTIFACT_NAME: wu104-cr10405-evidence
  WU104_UPSTREAM: locked-wu104/n8n/generated/SPM_WU104_STAGING_SHORT_QUERY_CANDIDATE.json
  WU104_EXPECTED_SHA256: 32721cae2b09531d8f4860373c37911ace9e95b6818babdca880fa08ef1b7bc9
  CR10501: /tmp/SPM_WU105_CR10501.json
  CR10501_SHA: e40610b13ec61a781acf44842b74955a88a11286e83baa7e121aee349cc9dcf0
  CR10502: /tmp/SPM_WU105_CR10502.json
  CR10502_SHA: 7fc201137671b1cd47f9fc6b4ec60a9b563b2bae7c0776952ec68e0988bfed1e
  CR10503: /tmp/SPM_WU105_CR10503.json
  CR10503_SHA: aaaa139faa67815f4196fb9779232471c4c8b051a26f0ba0a3be4c56231d4653
  WU105_FINAL: /tmp/SPM_WU105_FINAL_CR10504.json
  WU105_FINAL_SHA: 42ba2b9de1f52c0db1fc32e59974dc40ebce80b787677ac6b0d4418a6315bca1
  WU106_BASELINE: /tmp/SPM_WU106_BASELINE.json
  WU106_BASELINE_SHA: 134b2d861d6c5060ca52d8fd838b2cdd7d5d88ffa74855e3de1665e302afda67
  CR10601: /tmp/SPM_WU106_CR10601.json
  CR10601_SHA: 5db680c1e2b51d35408f78077ef4bb098da542bdf5e071125532948ad6783e2e
  CR10602: /tmp/SPM_WU106_CR10602.json
  CR10602_SHA: 50dbf22e2496e3c1b0ce7c9ff37edab752dbf6b69ddc62f80026942b31146014
  WU106_FINAL: /tmp/SPM_WU106_FINAL_CR10603.json
  WU106_FINAL_SHA: 2e219adbdd612106b782993cbcb2f94da6c0737b250264060b473f12f0fcc81f
  CANDIDATE: n8n/generated/SPM_WU107_STAGING_HUMAN_HANDOFF_CANDIDATE.json
  FINAL_SHA: fc4263b6bf029195a58b819ce4b06d6f499090d39017ff6ca906f173b7443f59
  EXPECTED_NAME: '[STAGING] SPM_WU107_HUMAN_HANDOFF_EXECUTION_V1'
  PRODUCTION_WORKFLOW_ID: CMBMpxX5AqqK2UTn
  WU101_STAGING_ID: mMZVFxJIxE7a9SSW
  WU102_STAGING_ID: 1kaRBBFVJYbPxvQG
  WU103_STAGING_ID: 5COEoxXjk8AvuGBa
  WU104_STAGING_ID: Bt3PvOIbFzU0O9gk
  WU105_STAGING_ID: KXfalaYSCLdgmf4X
  WU106_STAGING_ID: vvHvidUHVxM5wTVT

jobs:
  create:
    if: "${{ github.event.head_commit.message == 'WU-107: one-time inactive STAGING creation' }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: n8n-staging
    env:
      N8N_API_BASE_URL: ${{ secrets.N8N_API_BASE_URL }}
      N8N_API_KEY: ${{ secrets.N8N_API_KEY }}
      SPM_DEPLOY_CONFIRM: SPM_NONPROD_ONLY
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}

      - name: Download exact locked WU-104 evidence
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.WU104_ARTIFACT_NAME }}
          path: locked-wu104
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ env.WU104_LOCK_RUN_ID }}

      - name: Rebuild and certify exact WU-107 candidate
        shell: bash
        run: |
          set -euo pipefail
          git show origin/main:work-units/WU-105.lock.md > /tmp/WU-105.lock.md
          git show origin/main:work-units/WU-106.lock.md > /tmp/WU-106.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-105.lock.md
          grep -q '^Status: LOCKED$' /tmp/WU-106.lock.md
          grep -q "$WU105_FINAL_SHA" /tmp/WU-105.lock.md
          grep -q "$WU106_FINAL_SHA" /tmp/WU-106.lock.md
          test "$(sha256sum "$WU104_UPSTREAM" | awk '{print $1}')" = "$WU104_EXPECTED_SHA256"

          python scripts/wu105/build_candidate.py --baseline "$WU104_UPSTREAM" --manifest contracts/WU105_GOLDEN_INTENTS_V1.json --output "$CR10501"
          test "$(sha256sum "$CR10501" | awk '{print $1}')" = "$CR10501_SHA"
          python scripts/wu105/apply_cr10502.py --input "$CR10501" --output "$CR10502"
          test "$(sha256sum "$CR10502" | awk '{print $1}')" = "$CR10502_SHA"
          python scripts/wu105/apply_cr10503.py --input "$CR10502" --output "$CR10503"
          test "$(sha256sum "$CR10503" | awk '{print $1}')" = "$CR10503_SHA"
          python scripts/wu105/apply_cr10504.py --input "$CR10503" --output "$WU105_FINAL"
          test "$(sha256sum "$WU105_FINAL" | awk '{print $1}')" = "$WU105_FINAL_SHA"

          python scripts/wu106/build_candidate.py --baseline "$WU105_FINAL" --output "$WU106_BASELINE"
          test "$(sha256sum "$WU106_BASELINE" | awk '{print $1}')" = "$WU106_BASELINE_SHA"
          python scripts/wu106/apply_cr10601.py --input "$WU106_BASELINE" --output "$CR10601"
          test "$(sha256sum "$CR10601" | awk '{print $1}')" = "$CR10601_SHA"
          python scripts/wu106/apply_cr10602.py --input "$CR10601" --output "$CR10602"
          test "$(sha256sum "$CR10602" | awk '{print $1}')" = "$CR10602_SHA"
          python scripts/wu106/apply_cr10603.py --input "$CR10602" --output "$WU106_FINAL"
          test "$(sha256sum "$WU106_FINAL" | awk '{print $1}')" = "$WU106_FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["WU106_FINAL"]))["nodes"]))')" = "141"

          mkdir -p n8n/generated
          python scripts/wu107/build_candidate.py --baseline "$WU106_FINAL" --output "$CANDIDATE"
          python scripts/wu107/test_candidate.py --baseline "$WU106_FINAL" --candidate "$CANDIDATE"
          test "$(sha256sum "$CANDIDATE" | awk '{print $1}')" = "$FINAL_SHA"
          test "$(python -c 'import json,os; print(len(json.load(open(os.environ["CANDIDATE"]))["nodes"]))')" = "151"
          python scripts/validate_wu107_handoff_contract.py
          (cd scripts && python test_wu107_handoff_runtime.py)
          python scripts/wu106/test_journey_manifest.py
          python scripts/wu106/test_state_contract.py
          python scripts/wu106/test_runtime_matrix.py
          python - <<'PY'
          import json, os
          d=json.load(open('contracts/WU107_CANDIDATE_IDENTITY_V1.json'))
          assert d['status']=='OFFLINE_CERTIFIED_STAGING_DRY_RUN_PASS'
          assert d['candidate']['candidate_sha256']==os.environ['FINAL_SHA']
          assert d['candidate']['node_count']==151
          assert d['staging_dry_run']['deployer_result']=='PASS_DRY_RUN'
          assert d['staging_dry_run']['n8n_write_performed'] is False
          assert d['target_staging']['workflow_id'] is None
          assert d['execution_provider']['queue_receipt_is_human_acceptance'] is False
          print('WU107_PRE_CREATE_IDENTITY_PASS')
          PY

      - name: Preflight — refuse duplicate or protected workflow identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          base=os.environ['N8N_API_BASE_URL'].rstrip('/')
          key=os.environ['N8N_API_KEY']
          expected=os.environ['EXPECTED_NAME']
          protected={os.environ[k] for k in ['PRODUCTION_WORKFLOW_ID','WU101_STAGING_ID','WU102_STAGING_ID','WU103_STAGING_ID','WU104_STAGING_ID','WU105_STAGING_ID','WU106_STAGING_ID']}
          url=base+'/workflows?'+urllib.parse.urlencode({'limit':250})
          req=urllib.request.Request(url,headers={'accept':'application/json','X-N8N-API-KEY':key})
          with urllib.request.urlopen(req,timeout=45) as r: payload=json.loads(r.read().decode())
          rows=payload.get('data',[]) if isinstance(payload,dict) else []
          dup=[w for w in rows if w.get('name')==expected]
          if dup:
              raise SystemExit('WU107_CREATE_REFUSED_DUPLICATE_NAME:'+','.join(str(x.get('id')) for x in dup))
          if any(str(w.get('id')) in protected and w.get('name')==expected for w in rows):
              raise SystemExit('WU107_CREATE_REFUSED_PROTECTED_IDENTITY')
          print('WU107_REMOTE_DUPLICATE_PREFLIGHT_PASS')
          PY

      - name: Create exactly one new inactive WU-107 STAGING workflow
        run: python scripts/n8n/deploy_nonprod.py --artifact "$CANDIDATE" --environment staging --expected-sha256 "$FINAL_SHA" --mode apply --allow-create --result-file wu107-staging-create-result.json

      - name: Assert create result and verify exact remote content
        shell: bash
        run: |
          set -euo pipefail
          TARGET_ID="$(python - <<'PY'
          import json
          d=json.load(open('wu107-staging-create-result.json'))
          assert d['status']=='PASS_APPLY'
          assert d['operation']=='CREATE_INACTIVE_NONPROD'
          assert d['published_or_activated'] is False
          assert d['remote_active_after'] is False
          assert d['node_count']==151
          assert d['artifact_sha256']=='fc4263b6bf029195a58b819ce4b06d6f499090d39017ff6ca906f173b7443f59'
          print(d['target_workflow_id'])
          PY
          )"
          test -n "$TARGET_ID"
          for denied in "$PRODUCTION_WORKFLOW_ID" "$WU101_STAGING_ID" "$WU102_STAGING_ID" "$WU103_STAGING_ID" "$WU104_STAGING_ID" "$WU105_STAGING_ID" "$WU106_STAGING_ID"; do test "$TARGET_ID" != "$denied"; done
          N8N_TARGET_WORKFLOW_ID="$TARGET_ID" python scripts/wu107/verify_remote_staging.py | tee wu107-remote-readback.txt
          grep -q 'WU107_REMOTE_PASS' wu107-remote-readback.txt
          echo "WU107_CREATED_STAGING_ID=$TARGET_ID"

      - name: Upload WU-107 one-time STAGING creation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu107-one-time-staging-create-evidence
          path: |
            n8n/generated/SPM_WU107_STAGING_HUMAN_HANDOFF_CANDIDATE.json
            contracts/WU107_CANDIDATE_IDENTITY_V1.json
            wu107-staging-create-result.json
            wu107-remote-readback.txt
          if-no-files-found: ignore
          retention-days: 30
